<div *ngIf="venue" class="p-4">
  <!-- Hero Header -->
  <div class="surface-card border-round shadow-2 p-5 mb-4">
    <div class="flex align-items-start justify-content-between flex-wrap gap-3">
      <div>
        <h1 class="text-4xl font-bold mt-0 mb-3">{{ venue.name }}</h1>
        <div class="flex gap-4 flex-wrap">
          <span class="flex align-items-center gap-2 text-color-secondary">
            <i class="pi pi-map-marker text-primary text-xl"></i>
            {{ venue.city }}, {{ venue.country }}
          </span>
          <span class="flex align-items-center gap-2 text-color-secondary">
            <i class="pi pi-users text-primary text-xl"></i>
            Capacity: {{ venue.capacity }}
          </span>
          <span *ngIf="venue.phone" class="flex align-items-center gap-2 text-color-secondary">
            <i class="pi pi-phone text-primary text-xl"></i>
            {{ venue.phone }}
          </span>
        </div>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button
          pButton
          type="button"
          label="Edit Venue"
          icon="pi pi-pencil"
          *ngIf="isAdmin"
          [routerLink]="['/venues', venue._id, 'edit']"
        ></button>
        <button
          pButton
          type="button"
          label="Get Directions"
          icon="pi pi-map"
          class="p-button-outlined"
          (click)="getDirections()"
        ></button>
        <a
          pButton
          label="Visit Website"
          icon="pi pi-external-link"
          class="p-button-outlined"
          *ngIf="venue.website"
          [href]="venue.website"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
      </div>
    </div>
  </div>

  <p-tabView [(activeIndex)]="activeTabIndex">
    <p-tabPanel header="Overview" leftIcon="pi pi-home">
      <div class="grid">
        <div class="col-12 md:col-6">
          <p-card>
            <p class="text-lg line-height-3 mt-0 mb-0">{{ venue.description }}</p>
          </p-card>

          <div class="grid mt-3 equal-height-cards" *ngIf="venue.categories?.length || venue.amenities?.length">
            <div class="col-12" [class.md:col-6]="venue.amenities?.length" *ngIf="venue.categories?.length">
              <p-card>
                <ng-template pTemplate="header">
                  <div class="p-3 pb-0">
                    <h4 class="font-semibold mt-0 mb-0 flex align-items-center gap-2">
                      <i class="pi pi-list text-primary"></i> Categories
                    </h4>
                  </div>
                </ng-template>
                <div class="flex gap-2 flex-wrap">
                  <ng-container *ngFor="let cat of venue.categories">
                    <p-tag
                      *ngIf="cat"
                      [value]="cat"
                      severity="info"
                    ></p-tag>
                  </ng-container>
                </div>
              </p-card>
            </div>
            <div class="col-12" [class.md:col-6]="venue.categories?.length" *ngIf="venue.amenities?.length">
              <p-card>
                <ng-template pTemplate="header">
                  <div class="p-3 pb-0">
                    <h4 class="font-semibold mt-0 mb-0 flex align-items-center gap-2">
                      <i class="pi pi-check-circle text-primary"></i> Amenities
                    </h4>
                  </div>
                </ng-template>
                <div class="flex flex-column gap-2">
                  <span *ngFor="let amenity of venue.amenities" class="flex align-items-center gap-2">
                    <i class="pi pi-check text-green-500"></i>
                    {{ amenity }}
                  </span>
                </div>
              </p-card>
            </div>
          </div>
        </div>

        <div class="col-12 md:col-6">
          <div class="map-container">
            <div #mapContainer></div>
          </div>
        </div>
      </div>
    </p-tabPanel>

    <p-tabPanel header="Seats" leftIcon="pi pi-th-large">
      <app-seat-list [venueId]="venue._id" [isAdmin]="isAdmin"></app-seat-list>
    </p-tabPanel>

    <p-tabPanel header="Reviews & Photos" leftIcon="pi pi-images">
      <app-reviews-and-media
        [venueId]="venue._id"
        [isAdmin]="isAdmin"
        [currentUserId]="currentUserId"
      ></app-reviews-and-media>
    </p-tabPanel>

    <p-tabPanel header="Admin Dashboard" leftIcon="pi pi-cog" *ngIf="isAdmin">
      <app-venue-admin-dashboard
        [venueId]="venue._id"
      ></app-venue-admin-dashboard>
    </p-tabPanel>
  </p-tabView>
</div>
