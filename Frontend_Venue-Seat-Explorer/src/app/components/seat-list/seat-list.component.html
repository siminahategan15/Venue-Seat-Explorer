<div class="p-2">
  <div class="mb-5">
    <div class="flex justify-content-between align-items-center mb-3">
      <h3 class="text-2xl font-bold m-0">Sections</h3>
      <button
        pButton
        type="button"
        label="Add Section"
        icon="pi pi-plus"
        *ngIf="isAdmin"
        (click)="showCreateSectionForm = !showCreateSectionForm"
        class="p-button-outlined"
      ></button>
    </div>

    <div *ngIf="showCreateSectionForm && isAdmin" class="mb-4">
      <p-card>
        <form [formGroup]="createSectionForm" (ngSubmit)="onCreateSection()">
          <div class="grid">
            <div class="col-12 md:col-4">
              <div class="field">
                <label>Section Name</label>
                <input
                  pInputText
                  type="text"
                  formControlName="name"
                  placeholder="e.g. Section A"
                  class="w-full"
                />
              </div>
            </div>
            <div class="col-12 md:col-4">
              <div class="field">
                <label>Level</label>
                <p-dropdown
                  [options]="levelOptions"
                  formControlName="level"
                  placeholder="Select level"
                  class="w-full"
                ></p-dropdown>
              </div>
            </div>
            <div class="col-12 md:col-4">
              <div class="field">
                <label>Total Rows</label>
                <p-inputNumber
                  formControlName="totalRows"
                  [min]="1"
                  placeholder="Number of rows"
                  class="w-full"
                ></p-inputNumber>
              </div>
            </div>
          </div>
          <button
            pButton
            type="button"
            label="Create Section"
            icon="pi pi-check"
            class="mt-3"
            [loading]="loading"
            (click)="onCreateSection()"
          ></button>
        </form>
      </p-card>
    </div>

    <div *ngIf="sections.length > 0" class="mb-4">
      <div class="flex gap-2 flex-wrap">
        <p-tag
          *ngFor="let section of sections"
          [value]="section.name + ' (' + section.level + ')'"
          severity="info"
        >
          <button
            *ngIf="isAdmin"
            pButton
            type="button"
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text p-button-sm ml-2"
            (click)="deleteSection(section._id)"
          ></button>
        </p-tag>
      </div>
    </div>

    <div *ngIf="sections.length === 0" class="empty-state">
      <i class="pi pi-th-large"></i>
      <p class="mt-0">No sections available for this venue.</p>
    </div>
  </div>

  <div class="flex justify-content-between align-items-center mb-4">
    <h3 class="text-2xl font-bold m-0">Seat Map</h3>
    <button
      pButton
      type="button"
      label="Add Seat"
      icon="pi pi-plus"
      *ngIf="isAdmin"
      (click)="showCreateForm = !showCreateForm"
      class="p-button-success"
    ></button>
  </div>

  <div *ngIf="sections.length > 0" class="flex gap-2 flex-wrap mb-4">
    <button
      class="section-filter-btn"
      [class.active]="selectedSectionId === null"
      (click)="filterBySection(null)"
    >
      All
    </button>
    <button
      *ngFor="let section of sections"
      class="section-filter-btn"
      [class.active]="selectedSectionId === section._id"
      [style.borderColor]="selectedSectionId === section._id ? getSectionColor(section._id) : ''"
      [style.background]="selectedSectionId === section._id ? getSectionColor(section._id) : ''"
      (click)="filterBySection(section._id)"
    >
      {{ section.name }}
    </button>
  </div>

  <div *ngIf="showCreateForm && isAdmin" class="mb-5">
    <p-card>
      <form [formGroup]="createSeatForm" (ngSubmit)="onCreateSeat()">
        <div class="grid">
          <div class="col-12 md:col-4">
            <div class="field">
              <label>Seat Number</label>
              <input
                pInputText
                type="text"
                formControlName="seatNumber"
                placeholder="1"
                class="w-full"
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <div class="field">
              <label>Row</label>
              <input
                pInputText
                type="text"
                formControlName="row"
                placeholder="1"
                class="w-full"
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <div class="field">
              <label>Section</label>
              <p-dropdown
                [options]="sections"
                formControlName="sectionId"
                optionLabel="name"
                optionValue="_id"
                placeholder="Select section"
                class="w-full"
              ></p-dropdown>
            </div>
          </div>
        </div>
        <div class="flex align-items-center gap-3 mt-3">
          <button
            pButton
            type="button"
            label="Create Seat"
            icon="pi pi-check"
            [loading]="loading"
            (click)="onCreateSeat()"
          ></button>
          <small *ngIf="createSeatError" class="p-error">{{ createSeatError }}</small>
        </div>
      </form>
    </p-card>
  </div>

  <div class="arena-map-container" *ngIf="seatPositions.length > 0">
    <svg
      [attr.viewBox]="'0 0 ' + mapWidth + ' ' + mapHeight"
      class="arena-map"
      preserveAspectRatio="xMidYMid meet"
    >
      <rect
        [attr.x]="stageX"
        [attr.y]="stageY"
        [attr.width]="stageWidth"
        [attr.height]="stageHeight"
        rx="10"
        class="arena-stage"
      />
      <text
        [attr.x]="stageX + stageWidth / 2"
        [attr.y]="stageY + stageHeight / 2"
        text-anchor="middle"
        dominant-baseline="central"
        class="arena-stage-label"
      >
        STAGE
      </text>

      <ng-container *ngFor="let label of sectionLabels">
        <text
          [attr.x]="label.x"
          [attr.y]="label.y"
          text-anchor="middle"
          dominant-baseline="central"
          class="arena-section-label"
          [class.dimmed]="selectedSectionId && selectedSectionId !== label.sectionId"
        >
          {{ label.name }}
        </text>
      </ng-container>

      <ng-container *ngFor="let pos of seatPositions">
        <circle
          [attr.cx]="pos.x"
          [attr.cy]="pos.y"
          [attr.r]="isSeatSelected(pos) ? 7 : 5"
          [attr.fill]="isSeatDimmed(pos) ? '#d1d5db' : pos.color"
          [attr.stroke]="isSeatSelected(pos) ? '#ffffff' : 'none'"
          [attr.stroke-width]="isSeatSelected(pos) ? 2 : 0"
          class="arena-seat"
          [class.arena-seat-dimmed]="isSeatDimmed(pos)"
          [class.arena-seat-selected]="isSeatSelected(pos)"
          (click)="selectSeat(pos.seat)"
          (mouseenter)="onSeatHover($event, pos)"
          (mouseleave)="onSeatLeave()"
        />
      </ng-container>
    </svg>

    <div
      class="arena-tooltip"
      *ngIf="hoveredSeat"
      [style.left.px]="tooltipX"
      [style.top.px]="tooltipY"
    >
      <strong>Seat {{ hoveredSeat.seat.seatNumber }}</strong>
      <span>Row {{ hoveredSeat.seat.row }}</span>
      <span>{{ getSectionName(hoveredSeat.sectionId) }}</span>
    </div>
  </div>

  <div *ngIf="seatPositions.length === 0 && !loading" class="empty-state mt-4">
    <i class="pi pi-ticket"></i>
    <p class="mt-0">No seats added yet.</p>
  </div>

  <div *ngIf="selectedSeat" class="mt-5" #seatDetailSection>
    <p-card>
      <ng-template pTemplate="header">
        <div class="p-3 pb-0 flex justify-content-between align-items-center">
          <h4 class="font-bold m-0">
            <i class="pi pi-ticket mr-2 text-primary"></i>
            Seat Details: {{ selectedSeat.seatNumber }}
          </h4>
          <button
            pButton
            type="button"
            icon="pi pi-times"
            class="p-button-rounded p-button-text"
            (click)="selectedSeat = null"
          ></button>
        </div>
      </ng-template>
      <app-seat-detail [seatId]="selectedSeat._id"></app-seat-detail>
    </p-card>
  </div>
</div>
