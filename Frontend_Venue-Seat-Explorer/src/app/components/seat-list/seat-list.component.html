<div class="p-2">
  <div class="mb-5">
    <div class="flex justify-content-between align-items-center mb-3">
      <h3 class="text-2xl font-bold m-0">Sections</h3>
      <button
        pButton
        type="button"
        label="Add Section"
        icon="pi pi-plus"
        *ngIf="isAdmin"
        (click)="showCreateSectionForm = !showCreateSectionForm"
        class="p-button-outlined"
      ></button>
    </div>

    <div *ngIf="showCreateSectionForm && isAdmin" class="mb-4">
      <p-card>
        <form [formGroup]="createSectionForm" (ngSubmit)="onCreateSection()">
          <div class="grid">
            <div class="col-12 md:col-4">
              <div class="field">
                <label>Section Name</label>
                <input
                  pInputText
                  type="text"
                  formControlName="name"
                  placeholder="e.g. Section A"
                  class="w-full"
                />
              </div>
            </div>
            <div class="col-12 md:col-4">
              <div class="field">
                <label>Level</label>
                <p-dropdown
                  [options]="levelOptions"
                  formControlName="level"
                  placeholder="Select level"
                  class="w-full"
                ></p-dropdown>
              </div>
            </div>
            <div class="col-12 md:col-4">
              <div class="field">
                <label>Total Rows</label>
                <p-inputNumber
                  formControlName="totalRows"
                  [min]="1"
                  placeholder="Number of rows"
                  class="w-full"
                ></p-inputNumber>
              </div>
            </div>
          </div>
          <button
            pButton
            type="button"
            label="Create Section"
            icon="pi pi-check"
            class="mt-3"
            [loading]="loading"
            (click)="onCreateSection()"
          ></button>
        </form>
      </p-card>
    </div>

    <!-- Section tags (visible to all users) -->
    <div *ngIf="sections.length > 0" class="mb-4">
      <div class="flex gap-2 flex-wrap">
        <p-tag
          *ngFor="let section of sections"
          [value]="section.name + ' (' + section.level + ')'"
          severity="info"
        >
          <button
            *ngIf="isAdmin"
            pButton
            type="button"
            icon="pi pi-times"
            class="p-button-rounded p-button-danger p-button-text p-button-sm ml-2"
            (click)="deleteSection(section._id)"
          ></button>
        </p-tag>
      </div>
    </div>

    <div *ngIf="sections.length === 0" class="empty-state">
      <i class="pi pi-th-large"></i>
      <p class="mt-0">No sections available for this venue.</p>
    </div>
  </div>

  <!-- Seats -->
  <div class="flex justify-content-between align-items-center mb-4">
    <h3 class="text-2xl font-bold m-0">Available Seats</h3>
    <button
      pButton
      type="button"
      label="Add Seat"
      icon="pi pi-plus"
      *ngIf="isAdmin"
      (click)="showCreateForm = !showCreateForm"
      class="p-button-success"
    ></button>
  </div>

  <div *ngIf="showCreateForm && isAdmin" class="mb-5">
    <p-card>
      <form [formGroup]="createSeatForm" (ngSubmit)="onCreateSeat()">
        <div class="grid">
          <div class="col-12 md:col-4">
            <div class="field">
              <label>Seat Number</label>
              <input
                pInputText
                type="text"
                formControlName="seatNumber"
                placeholder="1"
                class="w-full"
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <div class="field">
              <label>Row</label>
              <input
                pInputText
                type="text"
                formControlName="row"
                placeholder="1"
                class="w-full"
              />
            </div>
          </div>
          <div class="col-12 md:col-4">
            <div class="field">
              <label>Section</label>
              <p-dropdown
                [options]="sections"
                formControlName="sectionId"
                optionLabel="name"
                optionValue="_id"
                placeholder="Select section"
                class="w-full"
              ></p-dropdown>
            </div>
          </div>
        </div>
        <button
          pButton
          type="button"
          label="Create Seat"
          icon="pi pi-check"
          class="mt-3"
          [loading]="loading"
          (click)="onCreateSeat()"
        ></button>
      </form>
    </p-card>
  </div>

  <div class="grid">
    <div *ngFor="let seat of seats" class="col-6 md:col-3 lg:col-2">
      <div
        class="seat-card"
        [class.selected]="selectedSeat?._id === seat._id"
        (click)="selectSeat(seat)"
      >
        <i class="pi pi-ticket text-2xl mb-2 text-primary"></i>
        <p class="font-bold text-lg mb-1">{{ seat.seatNumber }}</p>
        <p class="text-sm text-color-secondary mb-1">Row {{ seat.row }}</p>
        <p class="text-xs text-color-secondary mt-1">
          {{ getSectionName(seat.sectionId?._id || seat.sectionId) }}
        </p>
        <button
          pButton
          type="button"
          icon="pi pi-trash"
          class="p-button-sm p-button-danger p-button-text mt-2"
          *ngIf="isAdmin"
          (click)="deleteSeat(seat._id); $event.stopPropagation()"
        ></button>
      </div>
    </div>
  </div>

  <div *ngIf="seats.length === 0 && !loading" class="empty-state mt-4">
    <i class="pi pi-ticket"></i>
    <p class="mt-0">No seats added yet.</p>
  </div>

  <div *ngIf="selectedSeat" class="mt-5">
    <p-card>
      <ng-template pTemplate="header">
        <div class="p-3 pb-0 flex justify-content-between align-items-center">
          <h4 class="font-bold m-0">
            <i class="pi pi-ticket mr-2 text-primary"></i>
            Seat Details: {{ selectedSeat.seatNumber }}
          </h4>
          <button
            pButton
            type="button"
            icon="pi pi-times"
            class="p-button-rounded p-button-text"
            (click)="selectedSeat = null"
          ></button>
        </div>
      </ng-template>
      <app-seat-detail [seatId]="selectedSeat._id"></app-seat-detail>
    </p-card>
  </div>
</div>
