<div class="auth-gradient">
  <div class="auth-box">
    <div class="text-center mb-5">
      <i class="pi pi-building text-5xl text-primary mb-3"></i>
      <h1 class="text-4xl font-bold mb-2 mt-0">Venue Seat Explorer</h1>
      <h2 class="text-2xl font-semibold text-900 mt-0">Sign In</h2>
    </div>

    <p-message
      *ngIf="error"
      severity="error"
      [text]="error"
      class="w-full mb-4"
    ></p-message>

    <div class="p-fluid">
      <div class="field mb-4">
        <label for="email" class="font-semibold mb-2">Email</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-envelope"></i>
          <input
            id="email"
            pInputText
            type="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
          />
        </span>
      </div>

      <div class="field mb-5">
        <label for="password" class="font-semibold mb-2">Password</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-lock"></i>
          <input
            id="password"
            pInputText
            type="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
          />
        </span>
      </div>

      <button
        pButton
        type="button"
        label="Sign In"
        icon="pi pi-sign-in"
        class="w-full mb-4"
        (click)="onLogin()"
        [loading]="loading"
      ></button>
    </div>

    <div class="text-center mt-4">
      <span class="text-color-secondary">Don't have an account?</span>
      <button
        pButton
        type="button"
        label="Create one"
        class="p-button-text w-full mt-3"
        (click)="goToRegister()"
      ></button>
    </div>
  </div>
</div>
