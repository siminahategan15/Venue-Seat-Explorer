name: CI

on:
  push:
    branches: [main, seats-improvements]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend_Venue-Seat-Explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend_Venue-Seat-Explorer/package-lock.json
      - run: npm ci
      - run: npx eslint .

  frontend-lint-and-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend_Venue-Seat-Explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend_Venue-Seat-Explorer/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx ng build --configuration production
